{% with messages = get_flashed_messages(with_categories=True) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class='card-game {{ 'green lighten-4' if category == 'success' else 'red lighten-4' }}'>
                <span class="{{ 'green-text' if category == 'success' else 'red-text' }}">{{ message }}</span>
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}
